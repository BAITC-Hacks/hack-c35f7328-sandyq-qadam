name: Backend tests

on:
  pull_request:
    branches: [dev]
  push:
    branches: [feature/inventory]

permissions:
  contents: read

jobs:
  backend:
    name: Forecasting and Inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify dev is included in branch history
        if: github.event_name == 'push'
        run: git merge-base --is-ancestor origin/dev HEAD
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: python -m pip install -r requirements-backend.txt
      - name: Run all repository tests
        run: python -m pytest -v
